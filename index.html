<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вода и ксеноглоссия — Айк Самвелович Харатян</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071d2b;font-family:Arial,sans-serif;color:#183746}
.page{min-height:100vh;display:flex;justify-content:center;padding:24px 14px 40px}
.card{width:min(1000px,100%);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.28)}
.cover{width:100%;display:block;height:auto}
.actions{padding:28px 22px 32px;text-align:center;background:#f7fbfc}
.buttons{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.button{
 display:inline-flex;align-items:center;justify-content:center;
 min-width:260px;min-height:58px;padding:15px 25px;border-radius:14px;
 text-decoration:none;font-size:17px;font-weight:700;
 box-shadow:0 7px 18px rgba(20,70,85,.16);
 transition:transform .15s,box-shadow .15s;
}
.button:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,70,85,.22)}
.read{background:#236f86;color:#fff}
.download{background:#e5f3f6;color:#205c6d;border:2px solid #9bcbd5}
.small{margin:18px 0 0;font-size:14px;color:#728791}
@media(max-width:600px){
 .page{padding:0 0 25px}
 .card{border-radius:0}
 .actions{padding:22px 16px 28px}
 .button{width:100%;min-width:0}
}
</style>
</head>
<body>
<div class="page">
  <main class="card">
    <img class="cover" src="book-design.png" alt="Вода и ксеноглоссия — книга Айка Самвеловича Харатиана">
    <section class="actions">
      <div class="buttons">
        <a class="button read"
           href="https://drive.google.com/file/d/1-JpAtKLOSojDleMAgPE8a4ZMdjtABBrJ/view?usp=sharing"
           target="_blank" rel="noopener noreferrer">
          📖&nbsp; ЧИТАТЬ ОНЛАЙН
        </a>
        <a class="button download"
           href="https://drive.google.com/uc?export=download&amp;id=1-JpAtKLOSojDleMAgPE8a4ZMdjtABBrJ"
           target="_blank" rel="noopener noreferrer">
          ⬇️&nbsp; СКАЧАТЬ БЕСПЛАТНО
        </a>
      </div>
      <p class="small">Книга распространяется бесплатно.</p>
    </section>
  </main>
</div>
</body>
</html>
